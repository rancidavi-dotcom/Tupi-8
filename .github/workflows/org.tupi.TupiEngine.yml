id: org.tupi.TupiEngine
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tupi

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

modules:
  - name: tupi-engine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/tupi-engine/cargo
      sandbox:
        - --share=network
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} install PREFIX=/app DESTDIR=
    sources:
      - type: dir
        path: .
